<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ecfdf5" />
      <stop offset="100%" style="stop-color:#d1fae5" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#bfdbfe" />
      <stop offset="100%" style="stop-color:#dbeafe" />
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <circle cx="650" cy="120" r="60" fill="#fbbf24" opacity="0.3"/>
  <circle cx="650" cy="120" r="40" fill="#fbbf24" opacity="0.5"/>

  <!-- Mountains -->
  <polygon points="0,450 200,250 400,450" fill="#059669" opacity="0.15"/>
  <polygon points="200,450 450,200 700,450" fill="#059669" opacity="0.1"/>
  <polygon points="500,450 700,300 900,450" fill="#059669" opacity="0.12"/>

  <!-- Ground -->
  <rect x="0" y="420" width="800" height="380" fill="#d1fae5" opacity="0.5"/>

  <!-- Person silhouette (active, running) -->
  <g transform="translate(300, 200)" opacity="0.15">
    <!-- Head -->
    <circle cx="50" cy="0" r="25" fill="#1e1b4b"/>
    <!-- Body -->
    <line x1="50" y1="25" x2="50" y2="120" stroke="#1e1b4b" stroke-width="12" stroke-linecap="round"/>
    <!-- Arms -->
    <line x1="50" y1="50" x2="0" y2="90" stroke="#1e1b4b" stroke-width="8" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="100" y2="70" stroke="#1e1b4b" stroke-width="8" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="50" y1="120" x2="10" y2="200" stroke="#1e1b4b" stroke-width="8" stroke-linecap="round"/>
    <line x1="50" y1="120" x2="90" y2="190" stroke="#1e1b4b" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Energy particles -->
  <g opacity="0.3">
    <circle cx="200" cy="300" r="4" fill="#4F46E5"/>
    <circle cx="350" cy="250" r="3" fill="#4F46E5"/>
    <circle cx="500" cy="280" r="5" fill="#4F46E5"/>
    <circle cx="600" cy="320" r="3" fill="#4F46E5"/>
    <circle cx="250" cy="350" r="4" fill="#4F46E5"/>
    <circle cx="550" cy="260" r="3" fill="#4F46E5"/>
    <circle cx="150" cy="280" r="2" fill="#4F46E5"/>
    <circle cx="650" cy="350" r="4" fill="#4F46E5"/>
  </g>

  <!-- Small product bottle -->
  <g transform="translate(520, 350)">
    <rect x="0" y="0" width="60" height="120" rx="6" fill="#f8f9fa" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="5" y="5" width="50" height="5" rx="2.5" fill="#4F46E5"/>
    <text x="30" y="35" text-anchor="middle" font-family="Arial" font-size="8" font-weight="900" fill="#1e1b4b">NAD+</text>
    <text x="30" y="48" text-anchor="middle" font-family="Arial" font-size="5" fill="#6b7280">ultimate</text>
    <rect x="8" y="55" width="44" height="15" rx="7.5" fill="#f0fdf4" stroke="#86efac" stroke-width="0.5"/>
    <text x="30" y="66" text-anchor="middle" font-family="Arial" font-size="5" font-weight="800" fill="#166534">10 IN 1</text>
    <text x="30" y="90" text-anchor="middle" font-family="Arial" font-size="8" font-weight="900" fill="#1e1b4b">1,000mg</text>
  </g>

  <!-- Caption -->
  <rect x="100" y="680" width="600" height="70" rx="16" fill="#1e1b4b" opacity="0.8"/>
  <text x="400" y="710" text-anchor="middle" font-family="Arial" font-size="18" font-weight="800" fill="#fff">ENERGIA PARA TU DIA A DIA</text>
  <text x="400" y="735" text-anchor="middle" font-family="Arial" font-size="12" fill="#c7d2fe">Vive con vitalidad — Liposomal NAD+ Ultimate</text>
</svg>