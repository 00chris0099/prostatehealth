<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8faff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eef2ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bottleGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0f1f3;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="65%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e2e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="capGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d5a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="10" dy="18" stdDeviation="20" flood-color="#1e3a5f" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg1)"/>

  <!-- Grid dots -->
  <g opacity="0.03">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#1e3a5f"/>
    </pattern>
    <rect width="800" height="800" fill="url(#dots)"/>
  </g>

  <!-- Glow -->
  <ellipse cx="400" cy="420" rx="200" ry="250" fill="#4F46E5" opacity="0.04"/>

  <!-- === BOX (behind bottle) === -->
  <g transform="translate(380, 120)" filter="url(#shadow1)">
    <rect x="0" y="0" width="200" height="480" rx="12" fill="#1e1b4b"/>
    <rect x="8" y="8" width="184" height="464" rx="8" fill="#ffffff"/>
    <rect x="8" y="8" width="184" height="8" rx="8" fill="#4F46E5"/>
    <text x="100" y="45" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#6b7280" letter-spacing="3">NUTRIINGREDIENTS</text>
    <line x1="30" y1="55" x2="170" y2="55" stroke="#e2e8f0" stroke-width="1"/>
    <text x="100" y="85" text-anchor="middle" font-family="Arial" font-size="13" fill="#6b7280">liposomal</text>
    <text x="100" y="115" text-anchor="middle" font-family="Arial" font-size="36" font-weight="900" fill="#1e1b4b">NAD+</text>
    <text x="100" y="145" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#1e1b4b">ultimate</text>
    <line x1="50" y1="160" x2="150" y2="160" stroke="#4F46E5" stroke-width="2"/>
    <text x="100" y="185" text-anchor="middle" font-family="Arial" font-size="10" fill="#6b7280">NAD+, resveratrol, R, alpha</text>
    <text x="100" y="198" text-anchor="middle" font-family="Arial" font-size="10" fill="#6b7280">lipoic acid &amp; glutathione</text>
    <rect x="38" y="215" width="124" height="30" rx="15" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="100" y="235" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#166534">10 IN 1 ADVANCED</text>
    <text x="100" y="275" text-anchor="middle" font-family="Arial" font-size="24" font-weight="900" fill="#1e1b4b">1,000mg</text>
    <text x="100" y="295" text-anchor="middle" font-family="Arial" font-size="11" fill="#6b7280">per serving</text>
    <line x1="30" y1="310" x2="170" y2="310" stroke="#e2e8f0" stroke-width="1"/>
    <text x="100" y="335" text-anchor="middle" font-family="Arial" font-size="10" fill="#9ca3af">Dietary Supplement</text>
    <text x="100" y="350" text-anchor="middle" font-family="Arial" font-size="10" fill="#9ca3af">60 Vegetarian Capsules</text>
  </g>

  <!-- === BOTTLE (in front) === -->
  <g transform="translate(180, 100)" filter="url(#shadow1)">
    <!-- Shadow -->
    <ellipse cx="115" cy="460" rx="100" ry="14" fill="#1e3a5f" opacity="0.06"/>
    <!-- Cap -->
    <rect x="72" y="0" width="86" height="60" rx="8" fill="url(#capGrad1)"/>
    <rect x="75" y="10" width="80" height="5" rx="2.5" fill="#fff" opacity="0.12"/>
    <!-- Neck -->
    <rect x="80" y="60" width="70" height="35" rx="4" fill="url(#bottleGrad1)"/>
    <!-- Shoulder -->
    <path d="M 60 95 Q 60 115, 42 130 L 42 130 L 188 130 Q 170 115, 170 95 Z" fill="url(#bottleGrad1)"/>
    <!-- Body -->
    <rect x="42" y="130" width="146" height="320" rx="8" fill="url(#bottleGrad1)"/>
    <!-- Label -->
    <rect x="48" y="140" width="134" height="298" rx="5" fill="#fff"/>
    <rect x="48" y="140" width="134" height="6" rx="5" fill="#4F46E5"/>
    <text x="115" y="168" text-anchor="middle" font-family="Arial" font-size="9" font-weight="700" fill="#6b7280" letter-spacing="2">NUTRIINGREDIENTS</text>
    <line x1="65" y1="175" x2="165" y2="175" stroke="#e2e8f0" stroke-width="1"/>
    <text x="115" y="198" text-anchor="middle" font-family="Arial" font-size="10" fill="#6b7280">liposomal</text>
    <text x="115" y="222" text-anchor="middle" font-family="Arial" font-size="22" font-weight="900" fill="#1e1b4b">NAD+</text>
    <text x="115" y="245" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1e1b4b">ultimate</text>
    <line x1="80" y1="255" x2="150" y2="255" stroke="#4F46E5" stroke-width="2"/>
    <text x="115" y="275" text-anchor="middle" font-family="Arial" font-size="8" fill="#6b7280">NAD+, resveratrol, R, alpha</text>
    <text x="115" y="286" text-anchor="middle" font-family="Arial" font-size="8" fill="#6b7280">lipoic acid &amp; glutathione</text>
    <rect x="75" y="296" width="80" height="24" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
    <text x="115" y="312" text-anchor="middle" font-family="Arial" font-size="9" font-weight="800" fill="#166534">10 IN 1 ADVANCED</text>
    <text x="115" y="340" text-anchor="middle" font-family="Arial" font-size="16" font-weight="900" fill="#1e1b4b">1,000mg</text>
    <text x="115" y="355" text-anchor="middle" font-family="Arial" font-size="8" fill="#6b7280">per serving</text>
    <line x1="65" y1="365" x2="165" y2="365" stroke="#e2e8f0" stroke-width="1"/>
    <text x="115" y="382" text-anchor="middle" font-family="Arial" font-size="7" fill="#9ca3af">Dietary Supplement | 60 Vegetarian Capsules</text>
  </g>

  <!-- Caption -->
  <text x="400" y="760" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1e1b4b" opacity="0.5">VISTA FRONTAL — CAJA + FRASCO</text>
</svg>